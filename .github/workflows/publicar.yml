name: Publicar sitio
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: publicar
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Instalar Firebase CLI
        run: npm install -g firebase-tools@13
      - name: Publicar hosting y reglas
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          PROJECT=$(node -p "require('./.firebaserc').projects.default")
          firebase deploy --only hosting,firestore:rules --project "$PROJECT" --non-interactive
