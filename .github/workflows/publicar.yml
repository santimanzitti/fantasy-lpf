name: Publicar sitio
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: publicar
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Instalar Firebase CLI
        run: npm install -g firebase-tools@13
      - name: Publicar hosting y reglas
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "::error::Falta el secreto FIREBASE_SERVICE_ACCOUNT en Settings > Secrets and variables > Actions."; exit 1; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          PROJECT=$(node -p "JSON.parse(require('fs').readFileSync('.firebaserc','utf8')).projects.default")
          set +e
          firebase deploy --only hosting,firestore:rules --project "$PROJECT" --non-interactive 2>&1 | tee "$RUNNER_TEMP/out.txt"
          status=${PIPESTATUS[0]}
          if [ "$status" != "0" ]; then echo "::error::$(grep -v '^\s*$' "$RUNNER_TEMP/out.txt" | tail -12 | tr '\n' ' ' | cut -c1-1500)"; exit $status; fi
