<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Fantasy LPF · Liga Profesional</title>
<meta name="description" content="Fantasy gratis de la Liga Profesional Argentina: armá tu equipo, creá tu liga e invitá a tus amigos.">
<meta name="theme-color" content="#0a1120">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 40 40%22%3E%3Ccircle cx=%2220%22 cy=%2220%22 r=%229%22 fill=%22%23f3b73a%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de una columna estilo móvil (cabecera con saldo, contenido, barra inferior de pestañas); en escritorio se ensancha la grilla. */
:root{
  --bg:#0a1120; --surface:#121b2d; --surface2:#19243b; --line:#25324d; --fg:#eef2fa; --muted:#8d9bb8;
  --sky:#74c7f2; --sky-ink:#06243a; --sun:#f3b73a; --up:#30d27c; --down:#ff5d63;
  --pitch1:#1c7743; --pitch2:#1a6d3e; --pitch-line:rgba(255,255,255,.28);
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#eef2f8; --surface:#ffffff; --surface2:#e6ecf5; --line:#d3dbe8; --fg:#0f1a2e; --muted:#5b6a86;
  --sky:#1f8fd0; --sky-ink:#ffffff; --sun:#b27b06; --up:#13915a; --down:#d63a40;
  --pitch1:#26874f; --pitch2:#227c48; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#eef2f8; --surface:#ffffff; --surface2:#e6ecf5; --line:#d3dbe8; --fg:#0f1a2e; --muted:#5b6a86;
  --sky:#1f8fd0; --sky-ink:#ffffff; --sun:#b27b06; --up:#13915a; --down:#d63a40;
  --pitch1:#26874f; --pitch2:#227c48; color-scheme:light}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.4;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px));-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:var(--fg)}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px}

/* Cabecera */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand .sun{width:30px;height:30px;flex:none}
.brand h1{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.02em;margin:0;text-transform:uppercase;line-height:1;white-space:nowrap}
.brand h1 span{color:var(--sky)}
.brand small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wallet{display:flex;gap:14px;text-align:right}
.wallet div{display:flex;flex-direction:column}
.wallet b{font-family:var(--display);font-size:19px;font-weight:700;line-height:1.05}
.wallet span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.wallet .cash b{color:var(--sun)}

/* Barra inferior */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);padding-inline:4px}
.tabs button{background:none;border:0;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.02em}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--sky)}
.tabs .dot{position:relative}
.tabs .dot::after{content:"";position:absolute;top:-1px;right:-4px;width:7px;height:7px;border-radius:50%;background:var(--sun)}

main{padding-block:16px 24px}
.view{display:grid;gap:18px}
h2.sec{font-family:var(--display);font-size:24px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;margin:0;text-wrap:balance}
.sec-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.pad{padding:14px 16px}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:700;background:var(--surface2);border:1px solid var(--line)}
.btn.pri{background:var(--sky);color:var(--sky-ink);border-color:transparent}
.btn.gold{background:var(--sun);color:#1c1300;border-color:transparent}
.btn.danger{background:transparent;color:var(--down);border-color:color-mix(in srgb,var(--down) 50%,transparent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--surface2);color:var(--muted);letter-spacing:.03em}
.pos{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.06em;padding:1px 6px;border-radius:5px;color:#0b1220}
.pos-P{background:#f3b73a}.pos-D{background:#74c7f2}.pos-M{background:#79e0a3}.pos-F{background:#ff8a8f}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--muted)}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}

/* Cancha */
.pitch-wrap{display:grid;gap:12px}
.pitch{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:3/3.6;max-width:560px;width:100%;margin:0 auto;
  background:repeating-linear-gradient(180deg,var(--pitch1) 0 10%,var(--pitch2) 10% 20%);box-shadow:inset 0 0 0 2px var(--pitch-line)}
.pitch svg.lines{position:absolute;inset:0;width:100%;height:100%}
.pitch .row{position:absolute;left:0;right:0;display:flex;justify-content:space-evenly;transform:translateY(-50%)}
.slot{background:none;border:0;padding:0;width:74px;display:flex;flex-direction:column;align-items:center;gap:2px;color:#fff}
.slot .shirt{width:44px;height:48px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.35))}
.slot .nm{font-size:11.5px;font-weight:700;background:rgba(5,12,24,.78);padding:2px 6px;border-radius:5px;max-width:78px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .pr{font-family:var(--display);font-size:13px;font-weight:700;color:#ffd77a;line-height:1}
.slot.emptyslot .shirt{opacity:.55}
.slot.emptyslot .nm{background:rgba(255,255,255,.18)}
.team-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;max-width:560px;width:100%;margin:0 auto}
.select{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px}

/* Listas de jugadores */
.plist{display:grid}
.prow{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.prow:first-child{border-top:0}
.prow:hover{background:var(--surface2)}
.prow .shirt{width:38px;height:42px}
.prow .who{min-width:0}
.prow .who b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .meta{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.prow .val{text-align:right}
.prow .val b{font-family:var(--display);font-size:18px;font-weight:700;display:block;line-height:1.1}
.prow .val small{font-size:12px;font-weight:700}
.crest{width:18px;height:21px;vertical-align:middle;flex:none}

/* Mercado */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px 12px;align-items:center}
.mcard .shirt{width:52px;height:56px}
.mcard .info{min-width:0}
.mcard .info b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcard .foot{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px dashed var(--line);padding-top:10px}
.mcard .price{font-family:var(--display);font-size:22px;font-weight:700;line-height:1}
.mcard.hasbid{border-color:color-mix(in srgb,var(--sun) 60%,var(--line))}
.mybid{font-size:12px;color:var(--sun);font-weight:700}
.clock{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.clock .big{font-family:var(--display);font-size:30px;font-weight:800;letter-spacing:.02em;line-height:1}
.status-pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--surface2)}
.status-pill i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.status-pill.on i{background:var(--up)}
.status-pill.wait i{background:var(--sun)}

/* Filtros */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters input[type=search]{flex:1 1 200px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 10px;border-radius:7px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--sky);color:var(--sky-ink)}

/* Clasificación */
.rank{display:grid}
.rrow{display:grid;grid-template-columns:34px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.rrow:first-child{border-top:0}
.rrow .n{font-family:var(--display);font-size:22px;font-weight:800;color:var(--muted);text-align:center}
.rrow.me{background:color-mix(in srgb,var(--sky) 10%,transparent)}
.rrow .tn{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .k{text-align:right}
.rrow .k b{font-family:var(--display);font-size:19px;font-weight:700;display:block;line-height:1}
.rrow .k span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.feed{display:grid}
.feed div{padding:9px 16px;border-top:1px solid var(--line);font-size:14px;display:flex;gap:10px}
.feed div:first-child{border-top:0}
.feed time{color:var(--muted);font-size:12px;flex:none;min-width:70px;padding-top:1px}

/* Modal */
.modal-bg{position:fixed;inset:0;z-index:50;background:rgba(3,7,15,.6);display:flex;align-items:flex-end;justify-content:center}
@media (min-width:640px){.modal-bg{align-items:center}}
.modal{background:var(--surface);border:1px solid var(--line);width:100%;max-width:460px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
@media (min-width:640px){.modal{border-radius:18px}}
.mhead{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center}
.mhead .shirt{width:64px;height:70px}
.mhead h3{font-family:var(--display);font-size:26px;font-weight:700;margin:0;line-height:1.05;text-wrap:balance}
.x{background:var(--surface2);border:0;border-radius:50%;width:34px;height:34px;font-size:18px;line-height:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-block:16px}
.stats div{background:var(--surface2);border-radius:10px;padding:10px}
.stats span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stats b{font-family:var(--display);font-size:20px;font-weight:700}
.spark{width:100%;height:70px;display:block}
.actions{display:grid;gap:10px;margin-top:14px}
.bidbox{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center}
.bidbox input{width:100%;text-align:center;font-family:var(--display);font-size:22px;font-weight:700;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:8px}
.field{display:grid;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select{background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%}
.toggle{display:flex;align-items:center;gap:10px;font-weight:600}
.toggle input{width:20px;height:20px;accent-color:var(--sky)}

/* Ingreso */
.join{display:grid;gap:22px;padding-block:20px}
.join .hero{display:grid;gap:12px}
.join .hero h2{font-family:var(--display);font-size:clamp(34px,8vw,56px);font-weight:800;line-height:.95;margin:0;text-transform:uppercase;text-wrap:balance}
.join .hero h2 em{font-style:normal;color:var(--sky)}
.crestwall{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;max-width:520px}
.crestwall svg{width:100%;height:auto}
.joinform{display:grid;gap:12px;max-width:440px}
.rules{display:grid;gap:10px;max-width:640px}
.rules p{margin:0}

.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);font-weight:700;padding:10px 16px;border-radius:10px;z-index:60;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.3)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;align-items:start}
.ptsrow{display:grid;grid-template-columns:minmax(0,1fr) 74px;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.ptsrow input{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:6px;text-align:center;width:100%}
@media (prefers-reduced-motion:no-preference){.mcard,.prow,.slot{transition:transform .12s ease,background .12s}.slot:active{transform:scale(.96)}}
@media (max-width:420px){.wallet{gap:10px}.wallet b{font-size:17px}.brand small{display:none}.slot{width:64px}.slot .shirt{width:38px;height:42px}}

.ptsbadge{display:inline-block;min-width:20px;padding:0 4px;border-radius:4px;background:var(--up);color:#06210f;font-size:12px;margin-right:2px}
.ptsbadge.neg{background:var(--down);color:#2a0507}
.fxlist{display:grid}
.fx{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center;padding:9px 16px;border-top:1px solid var(--line);font-size:14px}
.fx .tm{display:flex;align-items:center;gap:6px;justify-content:flex-end;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.fx .tm.a{justify-content:flex-start}
.fx .mid{text-align:center;min-width:86px}
.fx .score{font-family:var(--display);font-size:20px}
.mlog{display:grid;gap:6px;margin-top:12px}
.mlog details{background:var(--surface2);border-radius:10px;padding:8px 12px}
.mlog summary{display:flex;justify-content:space-between;gap:10px;cursor:pointer;font-size:14px;font-weight:600;list-style:none}
.mlog summary::-webkit-details-marker{display:none}
.mlog .pl{display:flex;justify-content:space-between;font-size:13px;padding-top:5px;color:var(--muted)}
.ptable{display:grid;font-size:14px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ptable>div{display:grid;grid-template-columns:minmax(0,1.8fr) repeat(4,minmax(0,1fr));border-top:1px solid var(--line)}
.ptable>div:first-child{border-top:0}
.ptable span{padding:7px 10px}
.ptable span+span{text-align:center}
.ptable .ph{background:var(--surface2);font-family:var(--display);font-weight:700;letter-spacing:.05em}
@media (max-width:420px){.fx{padding-inline:10px;font-size:13px}.fx .mid{min-width:64px}}

.home{display:grid;gap:22px;padding-block:8px}
.lcard{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:14px 16px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.lcard:first-child{border-top:0}
.lcard:hover{background:var(--surface2)}
.lcard b{font-family:var(--display);font-size:20px;font-weight:700;display:block}
.invite{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.invite input{background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%;font-size:13px}
.gbtn{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:#1f1f1f;border:1px solid #dadce0;border-radius:10px;padding:11px 18px;font-weight:700}
.gbtn svg{width:18px;height:18px}
.back{background:none;border:0;color:var(--muted);font-weight:600;padding:4px 0}
.userchip{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0}
.userchip img{width:30px;height:30px;border-radius:50%}
.tabs[hidden]{display:none!important}
.lklist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.lk{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 16px;border-top:1px solid var(--line);font-size:14px}
.lkn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>

</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand">
    <svg class="sun" viewBox="0 0 40 40" aria-hidden="true"><g fill="var(--sun)"><circle cx="20" cy="20" r="8"/><g stroke="var(--sun)" stroke-width="2.4" stroke-linecap="round"><line x1="20" y1="2" x2="20" y2="8"/><line x1="20" y1="32" x2="20" y2="38"/><line x1="2" y1="20" x2="8" y2="20"/><line x1="32" y1="20" x2="38" y2="20"/><line x1="7.3" y1="7.3" x2="11.5" y2="11.5"/><line x1="28.5" y1="28.5" x2="32.7" y2="32.7"/><line x1="7.3" y1="32.7" x2="11.5" y2="28.5"/><line x1="28.5" y1="11.5" x2="32.7" y2="7.3"/></g></g></svg>
    <div style="min-width:0"><h1><a href="#/" style="color:inherit;text-decoration:none">Fantasy <span>LPF</span></a></h1><small id="teamname"></small></div>
  </div>
  <div class="wallet" id="wallet" hidden>
    <div class="cash"><b class="num" id="w-cash">–</b><span>Saldo</span></div>
    <div><b class="num" id="w-val">–</b><span>Valor</span></div>
  </div>
</div></header>
<main class="wrap" id="view"><div class="empty">Cargando…</div></main>
<nav class="tabs" id="tabs" aria-label="Secciones" hidden><div class="wrap">
  <button data-tab="equipo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M8 3 3 6l2 5 2-1v11h10V10l2 1 2-5-5-3c-1 2-7 2-8 0Z"/></svg>Equipo</button>
  <button data-tab="mercado" id="tab-mercado"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 17l5-5 4 4 8-8"/><path d="M15 8h5v5"/></svg>Mercado</button>
  <button data-tab="jugadores"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Jugadores</button>
  <button data-tab="liga"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M7 4h10v4a5 5 0 0 1-10 0V4Z"/><path d="M7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3M12 13v4M8 21h8M9 17h6"/></svg>Liga</button>
  <button data-tab="mas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>Más</button>
</div></nav>
<div class="modal-bg" id="modal" hidden></div>
<div class="toast" id="toast" hidden role="status"></div>
<script src="data.js"></script>
<script src="fmdata.js"></script>
<script src="engine.js"></script>
<script src="firebase-config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
